<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="description" content="Marco의 미국 서부 신혼여행 일정과 3D 동선을 한눈에 보는 여행 지도">
<title>Honeymoon Atlas · v23</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
<style>
:root{
  color-scheme:light;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.12);
  --ink:#1c1c1e;
  --muted:#6e6e73;
  --tertiary:#8e8e93;
  --separator:rgba(60,60,67,.14);
  --fill:rgba(120,120,128,.10);
  --glass:rgba(249,249,251,.84);
  --glass-strong:rgba(252,252,253,.94);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --sheet-peek:174px;
  --sheet-half:48dvh;
  --sheet-full:calc(100dvh - 86px - var(--safe-top));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e9edf2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(10,132,255,.35);outline-offset:2px}
[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#dfe5eb}
#map{position:absolute;inset:0}
#map::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(22,30,38,.12),transparent 20%,transparent 72%,rgba(22,30,38,.06))}
.maplibregl-canvas{filter:saturate(.88) contrast(.96) brightness(1.03)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:5!important;margin-bottom:calc(var(--sheet-half) + 16px + var(--safe-bottom));transition:margin-bottom .28s ease}
#app[data-sheet="peek"] .maplibregl-ctrl-bottom-left,#app[data-sheet="peek"] .maplibregl-ctrl-bottom-right{margin-bottom:calc(var(--sheet-peek) + 16px + var(--safe-bottom))}
#app[data-sheet="full"] .maplibregl-ctrl-bottom-left,#app[data-sheet="full"] .maplibregl-ctrl-bottom-right{opacity:0;pointer-events:none}

.topbar{position:absolute;z-index:30;top:calc(10px + var(--safe-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.brand,.top-actions{pointer-events:auto}
.brand{min-width:0;max-width:230px;padding:10px 13px 11px;border:1px solid rgba(255,255,255,.82);border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 8px 28px rgba(28,38,47,.13),inset 0 1px 0 rgba(255,255,255,.86)}
.brand span{display:block;margin-bottom:2px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.brand strong{display:block;overflow:hidden;font-size:17px;line-height:1.12;letter-spacing:-.025em;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:8px}
.icon-button{width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.82);border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 7px 24px rgba(28,38,47,.12),inset 0 1px 0 rgba(255,255,255,.86);cursor:pointer}
.icon-button:active,.map-tool:active,.nav-button:active,.action:active{transform:scale(.96)}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.citybar{position:absolute;z-index:29;top:calc(73px + var(--safe-top));left:10px;right:10px;display:flex;gap:7px;overflow-x:auto;padding:0 4px 5px;scrollbar-width:none;scroll-padding:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 24px),transparent)}
.citybar::-webkit-scrollbar,.day-strip::-webkit-scrollbar,.sheet-scroll::-webkit-scrollbar{display:none}
.city-chip{flex:none;min-height:38px;padding:0 13px;border:1px solid rgba(255,255,255,.78);border-radius:999px;background:rgba(250,250,252,.80);color:#343437;-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:0 5px 18px rgba(28,38,47,.09);font-size:14px;font-weight:650;cursor:pointer}
.city-chip[aria-pressed="true"]{border-color:rgba(28,28,30,.92);background:rgba(28,28,30,.92);color:#fff}

.map-toolbar{position:absolute;z-index:28;top:calc(122px + var(--safe-top));right:10px;display:flex;flex-direction:column;gap:8px}
.map-tool{min-width:46px;height:46px;padding:0 10px;border:1px solid rgba(255,255,255,.82);border-radius:23px;background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 6px 20px rgba(28,38,47,.11);font-size:12px;font-weight:750;cursor:pointer}
.map-tool[aria-pressed="true"]{border-color:rgba(28,28,30,.90);background:rgba(28,28,30,.90);color:#fff}

.sheet{position:absolute;z-index:40;left:7px;right:7px;bottom:calc(7px + var(--safe-bottom));height:var(--sheet-half);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.88);border-radius:30px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(175%);backdrop-filter:blur(30px) saturate(175%);box-shadow:0 18px 60px rgba(27,36,44,.22),inset 0 1px 0 rgba(255,255,255,.92);transition:height .32s cubic-bezier(.2,.82,.2,1)}
.sheet[data-state="peek"]{height:var(--sheet-peek)}
.sheet[data-state="full"]{height:var(--sheet-full)}
.grabber{position:relative;flex:0 0 25px;width:100%;height:25px;padding:0;border:0;background:transparent;cursor:ns-resize;touch-action:none}
.grabber span{position:absolute;left:50%;top:8px;width:38px;height:5px;transform:translateX(-50%);border-radius:999px;background:rgba(60,60,67,.25)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:2px 17px 10px}
.sheet-title{min-width:0;flex:1}
.sheet-title .eyebrow{display:block;margin-bottom:3px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em}
.sheet-title h1{margin:0;overflow:hidden;font-size:23px;line-height:1.08;letter-spacing:-.04em;text-overflow:ellipsis;white-space:nowrap}
.sheet-title p{margin:5px 0 0;overflow:hidden;color:var(--muted);font-size:14px;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}

.day-strip{display:flex;flex:0 0 auto;gap:5px;overflow-x:auto;padding:0 13px 10px;scrollbar-width:none}
.day-chip{flex:none;min-width:67px;min-height:48px;padding:6px 9px;border:0;border-radius:13px;background:transparent;text-align:left;cursor:pointer}
.day-chip span{display:block;color:var(--tertiary);font-size:12px;line-height:1.05}
.day-chip strong{display:block;margin-top:4px;font-size:13px;line-height:1.05}
.day-chip[aria-current="date"]{background:var(--ink);color:#fff}
.day-chip[aria-current="date"] span{color:rgba(255,255,255,.62)}

.journey{flex:0 0 auto;margin:0 13px 11px;padding:13px 14px 12px;border:1px solid rgba(60,60,67,.08);border-radius:20px;background:rgba(118,118,128,.075)}
.journey-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.journey-top span{color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.07em}
.journey-top strong{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pulse-track{position:relative;height:18px;margin:7px 4px 5px}
.pulse-line,.pulse-fill{position:absolute;left:0;right:0;top:8px;height:3px;border-radius:999px;background:rgba(60,60,67,.15)}
.pulse-fill{right:auto;width:0;background:var(--accent);transition:width .28s ease}
.pulse-dots{position:absolute;inset:0}
.pulse-dot{position:absolute;top:1px;width:17px;height:17px;padding:0;transform:translateX(-50%);border:3px solid rgba(248,248,250,.98);border-radius:50%;background:#c7c7cc;box-shadow:0 1px 5px rgba(0,0,0,.13);cursor:pointer}
.pulse-dot.done{background:var(--accent)}
.pulse-dot.current{width:19px;height:19px;top:0;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 2px 7px rgba(0,0,0,.14)}
.current-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:9px;align-items:center;margin-top:4px}
.nav-button{width:42px;height:42px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(118,118,128,.12);color:var(--accent);font-size:25px;line-height:1;cursor:pointer}
.nav-button:disabled{color:#aeaeb2;cursor:default;opacity:.55}
.current-copy{min-width:0;text-align:center}
.current-copy span{display:block;color:var(--tertiary);font-size:12px;font-weight:700}
.current-copy strong{display:block;margin-top:2px;overflow:hidden;font-size:16px;line-height:1.18;text-overflow:ellipsis;white-space:nowrap}
.current-copy small{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.next-stop{width:100%;margin-top:10px;padding:9px 11px;border:0;border-radius:13px;background:rgba(255,255,255,.72);color:var(--muted);text-align:left;font-size:13px;cursor:pointer}
.next-stop strong{color:var(--ink);font-weight:700}
.next-stop:disabled{cursor:default}

.sheet-scroll{min-height:0;flex:1;overflow-y:auto;padding:0 10px calc(26px + var(--safe-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stop-list{display:grid;gap:7px}
.stop-card{overflow:hidden;border:1px solid transparent;border-radius:18px;background:rgba(255,255,255,.56)}
.stop-card.selected{border-color:rgba(10,132,255,.22);background:rgba(255,255,255,.92)}
.stop-button{width:100%;min-height:62px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 11px;border:0;background:transparent;text-align:left;cursor:pointer}
.stop-number{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(118,118,128,.12);color:var(--muted);font-size:13px;font-weight:750}
.selected .stop-number{background:var(--accent);color:#fff}
.stop-copy{min-width:0}
.stop-copy strong{display:block;overflow:hidden;font-size:15px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.stop-copy small{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:13px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.stop-time{padding-left:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stop-detail{padding:0 12px 13px 59px}
.place-photo{width:100%;height:145px;display:block;margin:2px 0 11px;border-radius:15px;object-fit:cover;background:#e5e5ea}
.stop-detail p{margin:0;color:#48484a;font-size:15px;line-height:1.48}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.detail-meta span{padding:5px 8px;border-radius:999px;background:rgba(118,118,128,.10);color:var(--muted);font-size:12px}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.action{min-height:42px;display:flex;align-items:center;justify-content:center;border:0;border-radius:13px;background:rgba(118,118,128,.12);color:var(--accent);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.action.primary{background:var(--accent);color:#fff}

.overview-list{display:grid;gap:8px}
.overview-card{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px;border:0;border-radius:18px;background:rgba(255,255,255,.72);text-align:left;cursor:pointer}
.overview-index{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:750}
.overview-copy strong{display:block;font-size:16px}.overview-copy small{display:block;margin-top:3px;color:var(--muted);font-size:13px}.overview-arrow{color:var(--tertiary);font-size:21px}

.waypoint{width:30px;height:30px;display:grid;place-items:center;padding:0;border:3px solid rgba(255,255,255,.96);border-radius:50%;background:#3a3a3c;color:#fff;box-shadow:0 4px 13px rgba(20,28,35,.24);font-size:11px;font-weight:800;cursor:pointer}
.waypoint.selected{width:40px;height:40px;background:var(--accent);box-shadow:0 0 0 5px rgba(255,255,255,.65),0 6px 18px rgba(10,75,135,.25)}
.overview-pin{width:38px;height:38px;display:grid;place-items:center;padding:0;border:3px solid rgba(255,255,255,.96);border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(20,28,35,.22);font-size:12px;font-weight:800;cursor:pointer}
.search-pin{width:40px;height:40px;display:grid;place-items:center;border:3px solid #fff;border-radius:50% 50% 50% 0;background:var(--accent);color:#fff;box-shadow:0 5px 17px rgba(20,28,35,.24);transform:rotate(-45deg);font-weight:800}.search-pin span{transform:rotate(45deg)}

.map-status{position:absolute;z-index:26;top:calc(126px + var(--safe-top));left:12px;max-width:210px;padding:8px 10px;border:1px solid rgba(255,255,255,.78);border-radius:13px;background:var(--glass);color:var(--muted);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 5px 18px rgba(28,38,47,.08);font-size:12px;line-height:1.3;pointer-events:none;transition:opacity .22s ease}
.map-status.hide{opacity:0}
.toast{position:absolute;z-index:70;left:50%;bottom:calc(var(--sheet-half) + 21px + var(--safe-bottom));max-width:calc(100vw - 32px);padding:10px 14px;transform:translate(-50%,12px);overflow:hidden;border-radius:999px;background:rgba(28,28,30,.92);color:#fff;font-size:13px;font-weight:650;text-overflow:ellipsis;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{transform:translate(-50%,0);opacity:1}
#app[data-sheet="peek"] .toast{bottom:calc(var(--sheet-peek) + 21px + var(--safe-bottom))}
#app[data-sheet="full"] .toast{bottom:calc(28px + var(--safe-bottom))}

.dialog-backdrop{position:absolute;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px 8px calc(12px + var(--safe-bottom));background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dialog{width:min(600px,100%);max-height:78dvh;overflow-y:auto;padding:10px 16px 20px;border:1px solid rgba(255,255,255,.86);border-radius:28px;background:rgba(250,250,252,.97);box-shadow:0 22px 70px rgba(0,0,0,.23)}
.dialog-handle{width:38px;height:5px;margin:0 auto 13px;border-radius:99px;background:rgba(60,60,67,.24)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog h2{margin:0;font-size:22px;letter-spacing:-.035em}.dialog-close{width:34px;height:34px;border:0;border-radius:50%;background:rgba(118,118,128,.13);color:var(--muted);font-size:22px;cursor:pointer}
.search-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}.search-form input{min-width:0;height:46px;padding:0 13px;border:1px solid transparent;border-radius:13px;background:rgba(118,118,128,.12);color:var(--ink);font-size:16px}.search-submit{height:46px;padding:0 15px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.search-results{display:grid;gap:7px;margin-top:11px}.search-result{width:100%;padding:11px 12px;border:0;border-radius:14px;background:rgba(118,118,128,.09);text-align:left;cursor:pointer}.search-result strong{display:block;font-size:15px}.search-result small{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:13px;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}.dialog-note{margin:12px 2px 0;color:var(--muted);font-size:13px;line-height:1.45}

.sheet[data-state="peek"] .day-strip,.sheet[data-state="peek"] .sheet-scroll,.sheet[data-state="peek"] .journey-top,.sheet[data-state="peek"] .pulse-track,.sheet[data-state="peek"] .next-stop{display:none}
.sheet[data-state="peek"] .journey{margin-top:0;padding:8px 11px;background:transparent;border:0}
.sheet[data-state="peek"] .current-row{margin:0}

@media(min-width:900px){
  :root{--sheet-half:calc(100dvh - 24px)}
  .sheet,.sheet[data-state="peek"],.sheet[data-state="full"]{top:12px;bottom:12px;left:12px;right:auto;width:390px;height:auto;border-radius:28px}
  .grabber{display:none}
  .sheet-head{padding-top:17px}
  .topbar{left:416px;right:14px;top:12px}
  .citybar{left:416px;right:14px;top:76px}
  .map-toolbar{top:125px;right:14px}
  .map-status{top:125px;left:416px}
  .maplibregl-ctrl-bottom-left{margin-left:405px!important;margin-bottom:10px!important}.maplibregl-ctrl-bottom-right{margin-bottom:10px!important}
  #app[data-sheet="full"] .maplibregl-ctrl-bottom-left,#app[data-sheet="full"] .maplibregl-ctrl-bottom-right{opacity:1;pointer-events:auto}
  .toast,#app[data-sheet="peek"] .toast,#app[data-sheet="full"] .toast{left:calc(50% + 195px);bottom:24px}
  .dialog-backdrop{align-items:center;padding:24px}.dialog{border-radius:24px}
}
@media(max-width:520px){
  .brand{max-width:190px}.brand span{font-size:10px}.brand strong{font-size:16px}
  .citybar{top:calc(70px + var(--safe-top))}
  .map-toolbar{top:calc(116px + var(--safe-top))}
  .map-status{top:calc(116px + var(--safe-top));max-width:175px}
  .sheet-title h1{font-size:21px}
  .journey{margin-left:10px;margin-right:10px}
  .sheet-scroll{padding-left:7px;padding-right:7px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@supports (-webkit-touch-callout:none){.sheet{background:rgba(250,250,252,.95);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%)}}
</style>
</head>
<body>
<div id="app" data-sheet="half">
  <div id="map" role="region" aria-label="신혼여행 3D 지도"></div>

  <header class="topbar">
    <div class="brand"><span>DEC 28 – JAN 10</span><strong>Honeymoon Atlas</strong></div>
    <div class="top-actions">
      <button class="icon-button" id="overviewButton" type="button" aria-label="전체 여행 보기" title="전체 여행 보기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 6.5 5-2 7 2 5-2v13l-5 2-7-2-5 2z"></path><path d="M8.5 4.5v13M15.5 6.5v13"></path></svg>
      </button>
      <button class="icon-button" id="searchOpen" type="button" aria-label="지도에서 장소 찾기" title="장소 찾기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      </button>
    </div>
  </header>

  <nav class="citybar" id="citybar" aria-label="도시 선택"></nav>

  <div class="map-toolbar" aria-label="지도 보기 설정">
    <button class="map-tool" id="routeButton" type="button" aria-pressed="true" aria-label="일정 경로 표시">경로</button>
    <button class="map-tool" id="threeDButton" type="button" aria-pressed="true" aria-label="3D 지도 전환">3D</button>
    <button class="map-tool" id="northButton" type="button" aria-label="북쪽을 위로 맞추기">N</button>
  </div>

  <div class="map-status" id="mapStatus">지도를 불러오는 중입니다</div>

  <section class="sheet" id="sheet" data-state="half" aria-label="여행 일정">
    <button class="grabber" id="grabber" type="button" aria-label="일정 패널 크기 변경" aria-expanded="false"><span></span></button>
    <div class="sheet-head">
      <div class="sheet-title">
        <span class="eyebrow" id="dayMeta"></span>
        <h1 id="dayTitle"></h1>
        <p id="daySubtitle"></p>
      </div>
    </div>
    <nav class="day-strip" id="dayStrip" aria-label="여행 날짜 선택"></nav>

    <section class="journey" id="journeyPulse" aria-label="오늘의 일정 진행">
      <div class="journey-top"><span>JOURNEY</span><strong id="journeyCount"></strong></div>
      <div class="pulse-track" id="pulseTrack"><div class="pulse-line"></div><div class="pulse-fill" id="pulseFill"></div><div class="pulse-dots" id="pulseDots"></div></div>
      <div class="current-row">
        <button class="nav-button" id="previousStop" type="button" aria-label="이전 장소">‹</button>
        <div class="current-copy"><span>현재 선택</span><strong id="currentName"></strong><small id="currentMeta"></small></div>
        <button class="nav-button" id="nextStop" type="button" aria-label="다음 장소">›</button>
      </div>

const q=s=>document.querySelector(s);

function escapeHTML(value){return String(value??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function photoFor(stop){return PHOTO[stop?.id]||null}
function googleUrl(stop){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${stop.lat},${stop.lng}`)}`}
function lineData(coords){return {type:'FeatureCollection',features:coords.length>1?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]:[]}}
function toast(message){const el=q('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}

function renderStaticNavigation(){
  q('#citybar').innerHTML=cities.map(city=>`<button class="city-chip" type="button" data-city="${city.id}" aria-pressed="false">${city.name}</button>`).join('');
  q('#dayStrip').innerHTML=trips.map((day,index)=>`<button class="day-chip" type="button" data-day="${index}"><span>${day.date} ${day.weekday}</span><strong>DAY ${index+1}</strong></button>`).join('');
  q('#citybar').addEventListener('click',event=>{const button=event.target.closest('[data-city]');if(!button)return;selectCity(button.dataset.city)});
  q('#dayStrip').addEventListener('click',event=>{const button=event.target.closest('[data-day]');if(!button)return;selectDay(Number(button.dataset.day),true)});
}

function renderDay({fly=false}={}){
  state.overview=false;
  const day=trips[state.day];
  q('#dayMeta').textContent=`${day.date} ${day.weekday}요일 · DAY ${state.day+1}`;
  q('#dayTitle').textContent=day.title;
  q('#daySubtitle').textContent=day.subtitle;
  q('#journeyPulse').hidden=false;
  q('#overviewList').hidden=true;
  q('#stopList').hidden=false;
  document.querySelectorAll('[data-day]').forEach((button,index)=>button.setAttribute('aria-current',index===state.day?'date':'false'));
  document.querySelectorAll('[data-city]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.city===day.city?'true':'false'));
  q('[data-day="'+state.day+'"]')?.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest',inline:'center'});
  renderJourney();
  renderStops();
  if(mapReady){renderMarkers();drawRoute();if(fly)flyToDay(day)}
}

function renderJourney(){
  const day=trips[state.day],stop=day.stops[state.stop],next=day.stops[state.stop+1];
  q('#journeyCount').textContent=`${state.stop+1} / ${day.stops.length}`;
  q('#currentName').textContent=stop.name;
  q('#currentMeta').textContent=[stop.time,stop.sub].filter(Boolean).join(' · ');
  q('#previousStop').disabled=state.stop===0;
  q('#nextStop').disabled=state.stop===day.stops.length-1;
  const pct=day.stops.length===1?100:(state.stop/(day.stops.length-1))*100;
  q('#pulseFill').style.width=`${pct}%`;
  q('#pulseDots').innerHTML=day.stops.map((item,index)=>{
    const left=day.stops.length===1?50:(index/(day.stops.length-1))*100;
    const cls=index<state.stop?'done':index===state.stop?'current':'';
    return `<button class="pulse-dot ${cls}" type="button" data-pulse="${index}" style="left:${left}%" aria-label="${escapeHTML(item.name)}" aria-current="${index===state.stop?'step':'false'}"></button>`;
  }).join('');
  const card=q('#nextStopCard');
  if(next){card.disabled=false;card.innerHTML=`다음 <strong>${escapeHTML(next.time||'')} ${escapeHTML(next.name)}</strong> ›`;}
  else{card.disabled=true;card.innerHTML='<strong>오늘 일정의 마지막 장소입니다</strong>';}
}

function renderStops(){
  const day=trips[state.day];
  q('#stopList').innerHTML=day.stops.map((stop,index)=>{
    const selected=index===state.stop,photo=selected?photoFor(stop):null;
    return `<article class="stop-card ${selected?'selected':''}" data-stop-card="${index}">
      <button class="stop-button" type="button" data-stop="${index}" aria-pressed="${selected}">
        <span class="stop-number">${index+1}</span>
        <span class="stop-copy"><strong>${escapeHTML(stop.name)}</strong><small>${escapeHTML(stop.sub||'')}</small></span>
        <span class="stop-time">${escapeHTML(stop.time||'')}</span>
      </button>
      ${selected?`<div class="stop-detail">
        ${photo?`<img class="place-photo" src="${photo.url}" alt="${escapeHTML(stop.name)}" loading="lazy" referrerpolicy="no-referrer" data-photo>`:''}
        <p>${escapeHTML(stop.note||stop.sub||'일정에 포함된 방문 장소입니다.')}</p>
        <div class="detail-meta"><span>${escapeHTML(kindName[stop.kind]||'일정')}</span><span>${stop.lat.toFixed(4)}, ${stop.lng.toFixed(4)}</span>${photo?`<span>사진 · ${photo.credit}</span>`:''}</div>
        <div class="detail-actions"><button class="action primary" type="button" data-map-focus="${index}">지도에서 보기</button><a class="action" href="${googleUrl(stop)}" target="_blank" rel="noopener">길찾기 ↗</a></div>
      </div>`:''}
    </article>`;
  }).join('');
  q('#stopList').querySelectorAll('[data-photo]').forEach(img=>img.addEventListener('error',()=>img.remove(),{once:true}));
}

function selectDay(index,fly=false){
  state.day=Math.max(0,Math.min(trips.length-1,index));state.stop=0;
  renderDay({fly});
  requestAnimationFrame(()=>{sheetScroll.scrollTop=0});
}
function selectStop(index,fly=true){
  const day=trips[state.day];state.stop=Math.max(0,Math.min(day.stops.length-1,index));
  renderJourney();renderStops();
  if(mapReady){renderMarkers();if(fly)flyToStop(day.stops[state.stop])}
  q(`[data-stop-card="${state.stop}"]`)?.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});
}
function selectCity(id){
  if(id==='all'){showOverview();return}
  const index=trips.findIndex(day=>day.city===id);if(index>=0)selectDay(index,true);
}

function showOverview(){

  q('#dayMeta').textContent='2026.12.28 – 2027.01.10';

  q('#daySubtitle').textContent='Las Vegas → Palm Springs → Joshua Tree → San Diego → Texas';
  q('#journeyPulse').hidden=true;q('#stopList').hidden=true;q('#overviewList').hidden=false;
  document.querySelectorAll('[data-day]').forEach(button=>button.setAttribute('aria-current','false'));
  document.querySelectorAll('[data-city]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.city==='all'?'true':'false'));
  const tripCities=cities.filter(city=>city.id!=='all');
  q('#overviewList').innerHTML=tripCities.map((city,index)=>{
    const days=trips.filter(day=>day.city===city.id),first=days[0],last=days[days.length-1];
    return `<button class="overview-card" type="button" data-overview-city="${city.id}"><span class="overview-index">${index+1}</span><span class="overview-copy"><strong>${city.name}</strong><small>${first.date}${first!==last?` – ${last.date}`:''} · ${days.length}일</small></span><span class="overview-arrow">›</span></button>`;
  }).join('');
  if(mapReady)renderOverviewMap();
  requestAnimationFrame(()=>{sheetScroll.scrollTop=0});
}

q('#stopList').addEventListener('click',event=>{
  const focus=event.target.closest('[data-map-focus]');if(focus){selectStop(Number(focus.dataset.mapFocus),true);return}
  const button=event.target.closest('[data-stop]');if(button)selectStop(Number(button.dataset.stop),true);
});
q('#pulseDots').addEventListener('click',event=>{const button=event.target.closest('[data-pulse]');if(button)selectStop(Number(button.dataset.pulse),true)});
q('#previousStop').addEventListener('click',()=>selectStop(state.stop-1,true));
q('#nextStop').addEventListener('click',()=>selectStop(state.stop+1,true));
q('#nextStopCard').addEventListener('click',()=>{if(!q('#nextStopCard').disabled)selectStop(state.stop+1,true)});
q('#overviewList').addEventListener('click',event=>{const button=event.target.closest('[data-overview-city]');if(button)selectCity(button.dataset.overviewCity)});
q('#overviewButton').addEventListener('click',showOverview);

function clearMarkers(){markers.forEach(marker=>marker.remove());markers=[]}
function renderMarkers(){
  if(!mapReady)return;clearMarkers();
  const day=trips[state.day];
  day.stops.forEach((stop,index)=>{
    const el=document.createElement('button');el.type='button';el.className='waypoint'+(index===state.stop?' selected':'');el.textContent=String(index+1);el.setAttribute('aria-label',`${stop.name} 선택`);
    el.addEventListener('click',event=>{event.stopPropagation();if(state.sheet==='peek')setSheet('half');selectStop(index,true)});
    markers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([stop.lng,stop.lat]).addTo(map));
  });
}
function renderOverviewMap(){
  routeToken++;
  clearMarkers();
  const tripCities=cities.filter(city=>city.id!=='all');
  tripCities.forEach((city,index)=>{
    const el=document.createElement('button');el.type='button';el.className='overview-pin';el.textContent=String(index+1);el.setAttribute('aria-label',`${city.name} 일정 보기`);el.addEventListener('click',event=>{event.stopPropagation();selectCity(city.id)});
    markers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(city.center).addTo(map));
  });
  setRoute(tripCities.map(city=>city.center),'flight');fitCoordinates(tripCities.map(city=>city.center));
}

function flyToDay(day){fitCoordinates(day.stops.map(stop=>[stop.lng,stop.lat]))}
function flyToStop(stop){
  if(!mapReady)return;
  map.flyTo({center:[stop.lng,stop.lat],zoom:Math.max(13,Math.min(16,stop.zoom||15)),bearing:0,pitch:state.threeD?54:0,duration:reduceMotion?0:900,essential:false});
}
function fitCoordinates(coords){
  if(!mapReady||!coords.length)return;
  if(coords.length===1){map.easeTo({center:coords[0],zoom:13.5,bearing:0,pitch:state.threeD?48:0,duration:reduceMotion?0:700});return}
  const bounds=new maplibregl.LngLatBounds();coords.forEach(coord=>bounds.extend(coord));
  const desktop=innerWidth>=900;
  map.fitBounds(bounds,{padding:desktop?{top:130,bottom:70,left:440,right:90}:{top:150,bottom:Math.min(innerHeight*.52,430),left:45,right:65},maxZoom:14.2,bearing:0,pitch:state.threeD?42:0,duration:reduceMotion?0:900});
}

function setRoute(coords,style='road'){
  if(!mapReady||!map.getSource('trip-route'))return;
  map.getSource('trip-route').setData(lineData(coords));
  map.setLayoutProperty('trip-route-line','visibility',state.route?'visible':'none');
  map.setLayoutProperty('trip-route-glow','visibility',state.route?'visible':'none');
  map.setPaintProperty('trip-route-line','line-dasharray',style==='flight'?[2.2,1.7]:null);
}
async function drawRoute(){
  if(!mapReady||state.overview)return;
  const token=++routeToken,day=trips[state.day],fallback=day.stops.map(stop=>[stop.lng,stop.lat]);
  if(!state.route){setRoute(fallback,day.routeStyle);return}
  if(!day.roadRoute){setRoute(fallback,day.routeStyle);return}
  if(routeCache.has(day.id)){setRoute(routeCache.get(day.id),'road');return}
  try{
    const coords=day.stops.map(stop=>`${stop.lng},${stop.lat}`).join(';');
    const response=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`);
    if(!response.ok)throw new Error('route');
    const data=await response.json(),route=data.routes?.[0]?.geometry?.coordinates;
    if(token!==routeToken)return;
    if(route?.length){routeCache.set(day.id,route);setRoute(route,'road');return}
  }catch(error){}
  if(token===routeToken)setRoute(fallback,'flight');
}

function addMapLayers(){
  map.addSource('trip-route',{type:'geojson',data:lineData([])});
  map.addLayer({id:'trip-route-glow',type:'line',source:'trip-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'rgba(255,255,255,.9)','line-width':8,'line-blur':3}});
  map.addLayer({id:'trip-route-line',type:'line',source:'trip-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#0a84ff','line-width':4,'line-opacity':.94}});
}
function addTerrainAndBuildings(){
  try{
    map.addSource('terrain-dem',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json'});
    map.setTerrain({source:'terrain-dem',exaggeration:1.15});
  }catch(error){}
  try{
    const style=map.getStyle(),vectorId=Object.entries(style.sources||{}).find(([,source])=>source.type==='vector')?.[0];
    const before=(style.layers||[]).find(layer=>layer.type==='symbol')?.id;
    if(vectorId)map.addLayer({id:'trip-buildings',type:'fill-extrusion',source:vectorId,'source-layer':'building',minzoom:14.3,paint:{'fill-extrusion-color':'#d9dce0','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],'fill-extrusion-opacity':.80}},before);
  }catch(error){}
}
function initMap(){
  const status=q('#mapStatus');
  if(typeof maplibregl==='undefined'){status.textContent='지도를 불러오지 못했습니다. 일정은 계속 사용할 수 있습니다.';return}
  try{
    map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-115.22,36.12],zoom:10.5,pitch:54,bearing:0,maxPitch:70,antialias:true,attributionControl:false});
    map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Map © OpenStreetMap · Terrain © Mapterhorn'}),'bottom-left');
    map.on('load',()=>{
      mapReady=true;addTerrainAndBuildings();addMapLayers();status.classList.add('hide');
      if(!state.threeD){try{map.setTerrain(null)}catch(error){}if(map.getLayer('trip-buildings'))map.setLayoutProperty('trip-buildings','visibility','none')}
      if(state.overview)renderOverviewMap();else{renderMarkers();drawRoute();flyToDay(trips[state.day])}
    });
    map.on('error',()=>{});
    setTimeout(()=>{if(!mapReady)status.textContent='지도 연결이 느립니다. 일정은 계속 사용할 수 있습니다.'},7000);
  }catch(error){status.textContent='지도를 불러오지 못했습니다. 일정은 계속 사용할 수 있습니다.'}
}

q('#routeButton').addEventListener('click',()=>{
  state.route=!state.route;q('#routeButton').setAttribute('aria-pressed',String(state.route));
  if(mapReady){if(state.overview)renderOverviewMap();else drawRoute()}
});
q('#threeDButton').addEventListener('click',()=>{
  state.threeD=!state.threeD;q('#threeDButton').setAttribute('aria-pressed',String(state.threeD));
  if(!mapReady)return;
  try{map.setTerrain(state.threeD&&map.getSource('terrain-dem')?{source:'terrain-dem',exaggeration:1.15}:null)}catch(error){}
  if(map.getLayer('trip-buildings'))map.setLayoutProperty('trip-buildings','visibility',state.threeD?'visible':'none');
  map.easeTo({bearing:0,pitch:state.threeD?48:0,duration:reduceMotion?0:500});
});
q('#northButton').addEventListener('click',()=>{if(mapReady)map.easeTo({bearing:0,duration:reduceMotion?0:400})});

function setSheet(next){
  if(!['peek','half','full'].includes(next))next='half';
  state.sheet=next;sheet.dataset.state=next;app.dataset.sheet=next;q('#grabber').setAttribute('aria-expanded',String(next==='full'));
  setTimeout(()=>{if(mapReady)map.resize()},340);
}
let dragStart=0,dragging=false,suppressGrabberClick=false;
q('#grabber').addEventListener('pointerdown',event=>{dragStart=event.clientY;dragging=true;try{q('#grabber').setPointerCapture(event.pointerId)}catch(error){}});
q('#grabber').addEventListener('pointerup',event=>{
  if(!dragging)return;dragging=false;const delta=event.clientY-dragStart,order=['peek','half','full'];
  if(Math.abs(delta)>34){const index=order.indexOf(state.sheet),next=order[Math.max(0,Math.min(order.length-1,index+(delta>0?-1:1)))];suppressGrabberClick=true;setSheet(next);setTimeout(()=>suppressGrabberClick=false,120)}
});
q('#grabber').addEventListener('pointercancel',()=>dragging=false);
q('#grabber').addEventListener('click',()=>{if(suppressGrabberClick)return;setSheet(state.sheet==='peek'?'half':state.sheet==='half'?'full':'half')});

function openSearch(){q('#searchDialog').hidden=false;setTimeout(()=>q('#searchInput').focus(),20)}
function closeSearch(){q('#searchDialog').hidden=true;q('#searchOpen').focus()}
q('#searchOpen').addEventListener('click',openSearch);q('#searchClose').addEventListener('click',closeSearch);
q('#searchDialog').addEventListener('click',event=>{if(event.target===q('#searchDialog'))closeSearch()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!q('#searchDialog').hidden)closeSearch()});
q('#searchInput').addEventListener('keydown',event=>{if(event.key==='Enter')searchPlace()});q('#searchSubmit').addEventListener('click',searchPlace);

async function searchPlace(){
  const term=q('#searchInput').value.trim(),results=q('#searchResults');if(!term)return;
  results.textContent='검색 중…';
  try{
    const response=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(term)}`,{headers:{'Accept-Language':'ko,en'}});
    if(!response.ok)throw new Error('search');renderSearchResults(await response.json());
  }catch(error){results.textContent='검색 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'}
}
function renderSearchResults(items){
  const results=q('#searchResults');results.innerHTML='';
  if(!items.length){results.textContent='검색 결과가 없습니다.';return}
  items.forEach(item=>{
    const button=document.createElement('button');button.type='button';button.className='search-result';
    const title=document.createElement('strong');title.textContent=item.display_name.split(',').slice(0,2).join(', ');
    const detail=document.createElement('small');detail.textContent=item.display_name;button.append(title,detail);
    button.addEventListener('click',()=>{
      if(!mapReady){toast('지도가 준비되지 않았습니다');return}
      const lng=Number(item.lon),lat=Number(item.lat);if(tempMarker)tempMarker.remove();
      const el=document.createElement('div');el.className='search-pin';el.innerHTML='<span>★</span>';
      tempMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([lng,lat]).addTo(map);
      map.flyTo({center:[lng,lat],zoom:15.5,bearing:0,pitch:state.threeD?50:0,duration:reduceMotion?0:800,essential:false});closeSearch();toast('검색한 장소를 지도에 표시했습니다');
    });
    results.appendChild(button);
  });
}

function initialDay(){
  const now=new Date();
  for(let index=0;index<trips.length;index++){
    const tz=trips[index].city==='texas'?'America/Chicago':'America/Los_Angeles';
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
    const values=Object.fromEntries(parts.filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
    if(`${values.year}-${values.month}-${values.day}`===trips[index].iso)return index;
  }
  return 0;
}

renderStaticNavigation();
state.day=initialDay();
renderDay();
initMap();
</script>
</body>
