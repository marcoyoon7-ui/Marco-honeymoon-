      points:"대한항공 인천 직항이 있고 1/10 오후에 도착합니다. 친구분이 휴스턴 권역이라면 휴스턴에서 댈러스로 국내선(1시간)을 타고 DFW에서 직항을 검토하세요. 환승은 어차피 하는데, 그게 미국 안에서 끝나면 도착일이 확실해집니다.",
      links:[] }
  ],
  sched:[
    {t:"오전", x:"친구분과 인사"},
    {t:"—", x:"공항 도착", s:"국제선 출발 3시간 전"},
    {t:"—", x:"텍사스 → 인천 출발", s:"DFW 직항 약 14시간"},
    {t:"1/10", x:"인천 도착", s:"일요일 오후 · 1/11 월요일 출근"}
  ],
  notes:[{h:"가장 중요한 확인 사항", p:"예약 화면에서 한국 도착일이 1월 10일 일요일인지 직접 확인하세요. 1월 11일 월요일 출근이 이 일정의 유일한 절대 제약입니다. 휴스턴 IAH는 직항이 없어서 경유 조합에 따라 1/11 도착 위험이 있습니다."},
         {h:"도착 당일", p:"저녁에 억지로라도 정상 시간에 주무세요. 미국에서 한국으로 오는 방향이 시차 적응이 더 힘듭니다.", cool:true}]
}
];

const PREP = {
  order:["텍사스 → 인천 귀국편","인천 → 라스베이거스 국제선","12/31 LAS → PSP 이동편","그랜드캐니언 경비행기","Sphere 12/29","레드록캐니언 시간예약","1/2 에어리얼 트램웨이","커플 스파 · 카약 · 고래관찰"]
};

/* ===== app2.js ===== */
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const isTouch=matchMedia("(max-width:900px)").matches;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

let dayIx=0, placeIx=0, tab="place", mapType="m", mapView="place";

/* ---------- map: raster tiles as plain <img>, no iframe, no key ----------
   iframe이 차단되는 환경에서도 뜨도록 타일을 직접 배치해 그립니다.        */
const TILE=256;
const R2=(devicePixelRatio>1?"@2x":"");
const SUB="abcd";
const LAYERS={
  m:{url:(z,x,y)=>`https://${SUB[(x+y)%4]}.basemaps.cartocdn.com/light_all/${z}/${x}/${y}${R2}.png`,
     max:19, attr:"© OpenStreetMap · © CARTO"},
  k:{url:(z,x,y)=>`https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
     max:19, attr:"Esri, Maxar, Earthstar Geographics"},
  p:{url:(z,x,y)=>`https://services.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/${z}/${y}/${x}`,
     max:13, attr:"Esri, USGS, NOAA"}
};
const co=p=>`${p.lat},${p.lng}`;
const zoomFor=p=>/공항/.test(p.name)?12:/다운타운|리조트|국립기념물|미드호/.test(p.name)?13:14;

function proj(lat,lng,z){                       // → global pixels
  const n=Math.pow(2,z)*TILE, r=lat*Math.PI/180;
  return [(lng+180)/360*n,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n];
}
function unproj(px,py,z){
  const n=Math.pow(2,z)*TILE;
  const lng=px/n*360-180;
  const k=Math.PI-2*Math.PI*py/n;
  return [180/Math.PI*Math.atan(.5*(Math.exp(k)-Math.exp(-k))),lng];
}

const view={lat:36.11,lng:-115.17,z:14};
let tilesEl,base=[0,0],drag=null,pinch=null;

function fitDay(day){
  const pts=day.places.filter(p=>p.lat!=null);
  const el=$("#stage"), W=el.clientWidth||900, H=el.clientHeight||500;
  if(!pts.length) return;
  if(pts.length===1||mapView==="place"){
    const p=pts.includes(TRIP[dayIx].places[placeIx])?TRIP[dayIx].places[placeIx]:pts[0];
    view.lat=p.lat; view.lng=p.lng; view.z=zoomFor(p); return;
  }
  const la=pts.map(p=>p.lat), ln=pts.map(p=>p.lng);
  view.lat=(Math.min(...la)+Math.max(...la))/2;
  view.lng=(Math.min(...ln)+Math.max(...ln))/2;
  for(let z=17;z>=3;z--){
    const a=proj(Math.max(...la),Math.min(...ln),z), b=proj(Math.min(...la),Math.max(...ln),z);
    if(b[0]-a[0]<W-140 && b[1]-a[1]<H-160){ view.z=z; break }
  }
}

function renderMap(){
  const el=$("#stage"), W=el.clientWidth, H=el.clientHeight;
  if(!W||!H) return;
  const L=LAYERS[mapType]||LAYERS.m;
  view.z=Math.max(3,Math.min(L.max,Math.round(view.z)));
  const c=proj(view.lat,view.lng,view.z);
  const ox=c[0]-W/2, oy=c[1]-H/2;
  base=[ox,oy];
  tilesEl.style.transform="translate3d(0,0,0)";

  const n=Math.pow(2,view.z);
  const tx0=Math.floor(ox/TILE), tx1=Math.floor((ox+W)/TILE);
  const ty0=Math.floor(oy/TILE), ty1=Math.floor((oy+H)/TILE);
  let html="";
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    if(ty<0||ty>=n) continue;
    const wx=((tx%n)+n)%n;
    html+=`<img class="tl" loading="eager" src="${L.url(view.z,wx,ty)}" alt=""
      style="left:${tx*TILE-ox}px;top:${ty*TILE-oy}px">`;
  }
  // pins + connector
  const d=TRIP[dayIx], pts=d.places.map((p,i)=>({p,i})).filter(o=>o.p.lat!=null);
  const xy=o=>{const q=proj(o.p.lat,o.p.lng,view.z);return [q[0]-ox,q[1]-oy]};
  if(pts.length>1 && mapView==="route"){
    const pl=pts.map(o=>xy(o).join(",")).join(" ");
    html+=`<svg class="rt" width="${W}" height="${H}"><polyline points="${pl}"/></svg>`;
  }
  pts.forEach((o,k)=>{
    const [x,y]=xy(o);
    html+=`<button class="mk${o.i===placeIx?" on":""}" data-p="${o.i}"
      style="left:${x}px;top:${y}px"><i>${k+1}</i><em>${o.p.name}</em></button>`;
  });
  tilesEl.innerHTML=html;
  $$("#tiles .mk").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); placeIx=+b.dataset.p; tab="place";
    paintDay(); paintInfo(); renderMap(); setOpen();
  }));
  $("#attr").textContent=L.attr;
  $("#zlvl").textContent="z"+view.z;
}

function pan(dx,dy){
  const c=proj(view.lat,view.lng,view.z);
  const ll=unproj(c[0]-dx,c[1]-dy,view.z);
  view.lat=Math.max(-85,Math.min(85,ll[0])); view.lng=ll[1];
}
function zoomBy(k,cx,cy){
  const el=$("#stage"), W=el.clientWidth, H=el.clientHeight;
  const nz=Math.max(3,Math.min((LAYERS[mapType]||LAYERS.m).max,view.z+k));
  if(nz===view.z) return;
  if(cx!=null){ pan(-(cx-W/2)*(1-Math.pow(2,-k)), -(cy-H/2)*(1-Math.pow(2,-k))) }
  view.z=nz; renderMap();
}

function initMap(){
  const el=$("#stage");
  tilesEl=$("#tiles");
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest(".mk"))return;
    drag={x:e.clientX,y:e.clientY,sx:0,sy:0}; el.setPointerCapture(e.pointerId); el.classList.add("grab");
  });
  el.addEventListener("pointermove",e=>{
    if(!drag)return;
    drag.sx+=e.clientX-drag.x; drag.sy+=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    tilesEl.style.transform=`translate3d(${drag.sx}px,${drag.sy}px,0)`;
  });
  const end=()=>{ if(!drag)return; pan(drag.sx,drag.sy); drag=null; el.classList.remove("grab"); renderMap() };
  addEventListener("pointerup",end); addEventListener("pointercancel",end);
  el.addEventListener("wheel",e=>{e.preventDefault();
    const r=el.getBoundingClientRect();
    zoomBy(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  el.addEventListener("touchstart",e=>{if(e.touches.length===2){drag=null;
    pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});
  el.addEventListener("touchmove",e=>{
    if(e.touches.length===2&&pinch){
      const dd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(dd/pinch>1.6){zoomBy(1);pinch=dd} else if(dd/pinch<.63){zoomBy(-1);pinch=dd}
    }},{passive:true});
  addEventListener("touchend",()=>pinch=null);
  $("#zin").addEventListener("click",()=>zoomBy(1));
  $("#zout").addEventListener("click",()=>zoomBy(-1));
  $("#zfit").addEventListener("click",()=>{fitDay(TRIP[dayIx]);renderMap()});
  addEventListener("resize",()=>renderMap());
}

const linkPlace=p=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`+
  (p.pid?`&query_place_id=${p.pid}`:"");
function linkRoute(day){
  const pts=day.places.filter(p=>p.lat!=null);
  if(pts.length<2) return null;
  return `https://www.google.com/maps/dir/?api=1&origin=${co(pts[0])}&destination=${co(pts[pts.length-1])}`+
    (pts.length>2?`&waypoints=${pts.slice(1,-1).map(co).join("|")}`:"")+`&travelmode=driving`;
}
function paintMap(){
  const d=TRIP[dayIx];
  $("#v-route").classList.toggle("dim",d.places.filter(p=>p.lat!=null).length<2);
  const any=d.places.some(p=>p.lat!=null);
  $("#nomap").style.display=any?"none":"";
  $("#mapui").style.display=any?"":"none";
  if(!any){ tilesEl.innerHTML=""; setOpen(); return }
  fitDay(d); renderMap(); setOpen();
}
function setOpen(){
  const d=TRIP[dayIx], p=d.places[Math.min(placeIx,d.places.length-1)];
  const a=$("#gopen"), b=$("#groute");
  if(p&&p.lat!=null){ a.style.display=""; a.href=linkPlace(p); a.textContent=`${p.name} 구글맵으로 열기` }
  else a.style.display="none";
  const lr=linkRoute(d);
  if(lr){ b.style.display=""; b.href=lr } else b.style.display="none";
}

/* ---------- panels ---------- */
function regionColor(r){
  return {"라스베이거스":"#A8492B","그랜드캐니언":"#8E4326","팜스프링스":"#B07A2E",
    "조슈아트리":"#6E7A5C","샌디에이고":"#2E5A6B","텍사스":"#7C6A4E","귀국":"#3B3550"}[r]||"#A8492B";
}
function paintDay(){
  const d=TRIP[dayIx];
  $("#eyebrow").innerHTML=`<b>${d.date}</b> ${d.dow}요일 · ${d.region}`;
  $("#dayno").textContent=String(d.n).padStart(2,"0");
  $("#daytitle").textContent=d.title;
  $("#daysub").textContent=d.sub;
  $("#route").innerHTML=d.places.map((p,i)=>
    `<button class="chip${i===placeIx?" on":""}" data-p="${i}">${i+1} ${p.name}</button>`).join("");
  $$("#route .chip").forEach(b=>b.addEventListener("click",()=>{
    placeIx=+b.dataset.p; tab="place"; mapView="place";
    $$("#seg-view button").forEach(x=>x.classList.toggle("on",x.dataset.v==="place"));
    paintDay(); paintInfo(); paintMap();
  }));
  $("#facts").innerHTML=
    `<div class="fact"><span>${d.hi}° / ${d.lo}°</span>낮 · 밤</div>`+
    `<div class="fact"><span>${d.sunset}</span>일몰</div>`+
    `<div class="fact"><span>${d.elev.toLocaleString()}m</span>고도</div>`;
  document.documentElement.style.setProperty("--accent",regionColor(d.region));
}
function paintInfo(){
  const d=TRIP[dayIx];
  $$("#tabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const body=$("#body");
  if(tab==="place"){
    const p=d.places[Math.min(placeIx,d.places.length-1)];
    body.innerHTML=
      `<div class="kicker">장소 ${String(placeIx+1).padStart(2,"0")} · ${d.region}</div>`+
      `<div class="pname">${p.name}</div><div class="pmeta">${p.meta}</div>`+
      (p.lat!=null?`<div class="pcoord">${Math.abs(p.lat).toFixed(4)}° ${p.lat>=0?"N":"S"}　${Math.abs(p.lng).toFixed(4)}° ${p.lng>=0?"E":"W"}</div>`:"")+
      `<div class="sec"><h4>왜 이곳인가</h4><p>${p.history}</p></div>`+
      `<div class="sec"><h4>현장에서 볼 포인트</h4><p>${p.points}</p></div>`+
      ((p.links.length||p.lat!=null)?`<div class="links">${p.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join("")}`+
        (p.lat!=null?`<a href="${linkPlace(p)}" target="_blank" rel="noopener">구글맵에서 열기</a>`:"")+`</div>`:"");
  } else {
    body.innerHTML=
      d.sched.map(s=>`<div class="row"><time>${s.t}</time><div>${s.x}${s.s?`<small>${s.s}</small>`:""}</div></div>`).join("")+
      (d.notes||[]).map(n=>`<div class="note${n.cool?" cool":""}"><h5>${n.h}</h5><p>${n.p}</p></div>`).join("")+
      (d.bullets?`<ul class="bul">${d.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>`:"");
  }
}

/* ---------- elevation nav ---------- */
function drawProfile(){
  const svg=$("#profile"); if(!svg||!svg.clientWidth) return;
  const W=svg.clientWidth, H=98, pad=6, max=2700;
  const y=v=>H-pad-(v/max)*(H-pad*2-10);
  const xs=TRIP.map((_,i)=>(i+.5)/TRIP.length*W);
  const line=TRIP.map((d,i)=>`${xs[i]},${y(d.elev)}`).join(" ");
  const dots=TRIP.map((d,i)=>{
    const on=i===dayIx;
    return `<circle cx="${xs[i]}" cy="${y(d.elev)}" r="${on?5:2.6}" fill="${on?"var(--accent)":"#21262B"}" opacity="${on?1:.45}"/>`+
      (on?`<text x="${xs[i]}" y="${y(d.elev)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">${d.elev.toLocaleString()}</text>`:"");
  }).join("");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.innerHTML=`<polygon points="${xs[0]},${H} ${line} ${xs[xs.length-1]},${H}" fill="rgba(33,38,43,.055)"/>`+
    `<polyline points="${line}" fill="none" stroke="rgba(33,38,43,.42)" stroke-width="1.4" stroke-linejoin="round"/>`+dots;
}
function buildDays(){
  $("#days").innerHTML=TRIP.map((d,i)=>
    `<button class="dbtn${i===dayIx?" on":""}" data-d="${i}"><b>${String(d.n).padStart(2,"0")}</b><i>${d.short}</i></button>`).join("");
  $$("#days .dbtn").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.d)));
}

/* ---------- nav ---------- */
function go(i){
  dayIx=(i+TRIP.length)%TRIP.length; placeIx=0;
  paintDay(); paintInfo(); paintMap(); buildDays(); drawProfile();
  const act=$("#days .dbtn.on");
  if(act&&isTouch) act.scrollIntoView({block:"nearest",inline:"center",behavior:reduce?"auto":"smooth"});
}
$("#prev").addEventListener("click",()=>go(dayIx-1));
$("#next").addEventListener("click",()=>go(dayIx+1));
addEventListener("keydown",e=>{
  if(e.target.tagName==="IFRAME") return;
  if(e.key==="ArrowRight")go(dayIx+1);
  if(e.key==="ArrowLeft")go(dayIx-1);
});
$$("#tabs .tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;paintInfo()}));

function seg(id,setter){
  $$("#"+id+" button").forEach(b=>b.addEventListener("click",()=>{
    if(b.disabled) return;
    $$("#"+id+" button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); setter(b.dataset.v); paintMap();
  }));
}
seg("seg-type",v=>mapType=v);

seg("seg-view",v=>mapView=v);

addEventListener("resize",drawProfile);
$("#start").addEventListener("click",()=>{
  $("#intro").classList.add("gone");
  setTimeout(()=>{$("#intro").style.display="none";drawProfile()},700);
});
initMap();
go(0);
setTimeout(()=>{drawProfile();renderMap()},120);
})();

</script>
</body>
</html>
